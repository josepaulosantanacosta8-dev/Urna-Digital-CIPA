
name: Build Urna Digital CIPA APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "MainActivity.kt"
      - "AndroidManifest.xml"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Instalar ferramentas Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Organizar o projeto Android
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/br/com/urnacipa

          cp MainActivity.kt \
            app/src/main/java/br/com/urnacipa/MainActivity.kt

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml

          sed -i \
            '/import android.app.Activity/a import android.app.AlertDialog' \
            app/src/main/java/br/com/urnacipa/MainActivity.kt

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "br.com.urnacipa"
              compileSdk = 35

              defaultConfig {
                  applicationId = "br.com.urnacipa"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: Urna-Digital-CIPA-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
